apiVersion: apps/v1
kind: Deployment
metadata:
  name: sanos-celery
  namespace: sanosysalvos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sanos-celery
  template:
    metadata:
      labels:
        app: sanos-celery
    spec:
      containers:
        - name: celery
          image: 053760945279.dkr.ecr.us-east-1.amazonaws.com/sanos-mascotas-serv:v3
          command: ["celery", "-A", "mascotas_serv", "worker", "--loglevel=info"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sanos-secrets
                  key: DATABASE_URL_MASCOTAS
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sanos-secrets
                  key: SECRET_KEY_MASCOTAS
            - name: DEBUG
              value: "False"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sanos-secrets
                  key: REDIS_URL
            - name: NOTIFICACIONES_SERVICE_URL
              value: "http://sanos-notificaciones:8000"
            - name: AI_SERVICE_URL
              value: "http://sanos-fastapi-ia:8006"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
