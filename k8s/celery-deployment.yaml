apiVersion: apps/v1
kind: Deployment
metadata:
  name: sanos-celery
  namespace: sanosysalvos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sanos-celery
  template:
    metadata:
      labels:
        app: sanos-celery
    spec:
      containers:
        - name: celery
          image: {{ECR_URL}}/sanos-mascotas-serv:v1
          command: ["celery", "-A", "mascotas_serv", "worker", "--loglevel=info"]
          env:
            - name: DATABASE_URL
              value: "postgresql://sanos_admin:$(DB_PASSWORD)@sanos-mascotas-db.c9oo6visqpir.us-east-1.rds.amazonaws.com:5432/mascotas_db"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sanos-secrets
                  key: DB_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sanos-secrets
                  key: SECRET_KEY_MASCOTAS
            - name: DEBUG
              value: "False"
            - name: REDIS_URL
              value: "redis://san-re-41v4ud2cwljl.ruzbk7.0001.use1.cache.amazonaws.com:6379/0"
            - name: NOTIFICACIONES_SERVICE_URL
              value: "http://sanos-notificaciones:8000"
            - name: AI_SERVICE_URL
              value: "http://sanos-fastapi-ia:8006"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
