apiVersion: apps/v1
kind: Deployment
metadata:
  name: sanos-noticias
  namespace: sanosysalvos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sanos-noticias
  template:
    metadata:
      labels:
        app: sanos-noticias
    spec:
      containers:
        - name: noticias
          image: {{ECR_URL}}/sanos-noticias-serv:v1
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql://sanos_admin:$(DB_PASSWORD)@sanos-noticias-db.c9oo6visqpir.us-east-1.rds.amazonaws.com:5432/noticias_db"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sanos-secrets
                  key: DB_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sanos-secrets
                  key: SECRET_KEY_NOTICIAS
            - name: DEBUG
              value: "False"
            - name: ALLOWED_HOSTS
              value: "*"
            - name: USUARIOS_SERVICE_URL
              value: "http://sanos-usuarios:8000"
            - name: AUTH_SERVICE_URL
              value: "http://sanos-auth:8000/api/auth"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: sanos-noticias
  namespace: sanosysalvos
spec:
  selector:
    app: sanos-noticias
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
