apiVersion: apps/v1
kind: Deployment
metadata:
  name: sanos-frontend
  namespace: sanosysalvos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sanos-frontend
  template:
    metadata:
      labels:
        app: sanos-frontend
    spec:
      containers:
        - name: frontend
          image: {{ECR_URL}}/sanos-frontend:v1
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: sanos-frontend
  namespace: sanosysalvos
spec:
  selector:
    app: sanos-frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
